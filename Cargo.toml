[workspace]
resolver = "2"
members = ["crates/ahrefs", "crates/ahrefs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/ljh-sh/ahrefs"
keywords = ["ahrefs", "seo", "backlinks", "cli", "api-client"]
categories = ["api-bindings", "command-line-utilities", "web-programming"]

[workspace.dependencies]
ahrefs = { path = "crates/ahrefs", version = "0.1.0" }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
